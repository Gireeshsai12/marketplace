name: marketplace
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-marketplace-dev}
    volumes: ["database:/var/lib/postgresql/data"]

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/marketplace
      DATABASE_USER: marketplace
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-marketplace-dev}
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      UPLOAD_DIR: /app/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
    volumes: ["uploads:/app/uploads"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8090:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  database:
  uploads:


