server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 5m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
  location /uploads/ { proxy_pass http://backend:8080; }
  location / { try_files $uri $uri/ /index.html; }
}
